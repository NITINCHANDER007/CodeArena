services:
  # Primary App PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: codearena-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codearena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codearena"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Primary App Redis & Submission Queue
  redis:
    image: redis:7-alpine
    container_name: codearena-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Judge0 Database
  judge0-db:
    image: postgres:13-alpine
    container_name: codearena-judge0-db
    restart: always
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
      POSTGRES_DB: judge0
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Judge0 Server
  judge0-server:
    image: judge0/judge0:v1.13.1
    container_name: codearena-judge0-server
    restart: always
    ports:
      - "2358:2358"
    privileged: true
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    environment:
      - VIRTUAL_HOST=localhost
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
      - POSTGRES_DB=judge0
    depends_on:
      judge0-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Judge0 Workers
  judge0-worker:
    image: judge0/judge0:v1.13.1
    container_name: codearena-judge0-worker
    restart: always
    privileged: true
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
      - POSTGRES_DB=judge0
    depends_on:
      judge0-db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  judge0_db_data:

# Judge0 Configuration
# Documentation: https://github.com/judge0/judge0/blob/master/CHANGELOG.md

# Server settings
RAILS_MAX_THREADS=10
RAILS_MIN_THREADS=5
PORT=2358

# Language and execution limits
MAX_CPU_TIME_LIMIT=15.0
MAX_CPU_EXTRA_TIME=5.0
MAX_WALL_TIME_LIMIT=30.0
MAX_MEMORY_LIMIT=512000
MAX_STACK_LIMIT=128000
MAX_MAX_PROCESSES_AND_OR_THREADS=120
MAX_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
MAX_MAX_FILE_SIZE=20480
MAX_NUMBER_OF_RUNS=10

# Maintenance and telemetry
MAINTENANCE_MODE=false
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
